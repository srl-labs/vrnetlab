# Install on the target repository's default branch.
name: ToFaRev
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
jobs:
  review:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.type == 'User' &&
      contains(fromJSON('["hellt","flosch62","FloSch62","kaelemc","sacckth"]'), github.event.comment.user.login) &&
      contains(github.event.comment.body, '/tofarev review')
    uses: hellt/tofarev/.github/workflows/review.yml@ca96ef91456e98df7dc67f67260c6703755cb211
    with:
      bot_repository: hellt/tofarev
      bot_ref: ca96ef91456e98df7dc67f67260c6703755cb211
      app_client_id: ${{ vars.TOFAREV_APP_CLIENT_ID }}
      trusted_config: '{"repository":"srl-labs/vrnetlab","repositoryId":329897593,"allowedUsers":["hellt","flosch62","kaelemc","sacckth"],"shareSessions":true}'
    secrets:
      TOFAREV_API_KEY: ${{ secrets.TOFAREV_API_KEY }}
      TOFAREV_PAGES_DEPLOY_KEY: ${{ secrets.TOFAREV_PAGES_DEPLOY_KEY }}
      TOFAREV_APP_PRIVATE_KEY: ${{ secrets.TOFAREV_APP_PRIVATE_KEY }}
